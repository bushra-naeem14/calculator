<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="calculator">
    <div class="display-container">
      <div id="previous-display" class="previous-display"></div>
      <div id="current-display" class="current-display">0</div>
    </div>
    
    <div class="buttons">
      <!-- Row 1 -->
      <button class="btn action" id="clear">C</button>
      <button class="btn action" id="backspace">⌫</button>
      <button class="btn number" id="decimal">.</button>
      <button class="btn operator" data-op="/">÷</button>

      <!-- Row 2 -->
      <button class="btn number">7</button>
      <button class="btn number">8</button>
      <button class="btn number">9</button>
      <button class="btn operator" data-op="*">×</button>

      <!-- Row 3 -->
      <button class="btn number">4</button>
      <button class="btn number">5</button>
      <button class="btn number">6</button>
      <button class="btn operator" data-op="-">-</button>

      <!-- Row 4 -->
      <button class="btn number">1</button>
      <button class="btn number">2</button>
      <button class="btn number">3</button>
      <button class="btn operator" data-op="+">+</button>

      <!-- Row 5 -->
      <button class="btn number">0</button>
      <button class="btn equals" id="equals">=</button>
    </div>
  </div>
</body>
</html>
